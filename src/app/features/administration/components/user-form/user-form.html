<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="form-container">
    <div class="form-group">
        <label>Tipo de Documento *</label>
        <select formControlName="tipoDocumentoId">
            <option value="">Seleccione...</option>
            @for (tipo of tiposDocumento; track tipo.id) {
                <option [value]="tipo.id">{{ tipo.nombre }} ({{ tipo.codigo }})</option>
            }
        </select>
    </div>

    <div class="form-group">
        <label>Documento *</label>
        <input type="text" formControlName="documento" placeholder="Número de documento" />
    </div>

    <div class="form-group">
        <label>Rol *</label>
        <select formControlName="rolId">
            <option value="">Seleccione...</option>
            @for (rol of roles; track rol.id) {
                <option [value]="rol.id">{{ rol.nombre }}</option>
            }
        </select>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Primer Nombre *</label>
            <input type="text" formControlName="primerNombre" />
        </div>
        <div class="form-group">
            <label>Segundo Nombre</label>
            <input type="text" formControlName="segundoNombre" />
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Primer Apellido *</label>
            <input type="text" formControlName="primerApellido" />
        </div>
        <div class="form-group">
            <label>Segundo Apellido</label>
            <input type="text" formControlName="segundoApellido" />
        </div>
    </div>

    <div class="form-group">
        <label>Contraseña {{ user ? '(Opcional al editar)' : '*' }}</label>
        <input type="password" formControlName="clave" placeholder="••••••••" />
    </div>

    <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onCancel.emit()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="userForm.invalid">
            {{ user ? 'Actualizar' : 'Guardar' }}
        </button>
    </div>
</form>
