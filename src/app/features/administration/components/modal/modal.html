@if (isOpen) {
<div class="modal-backdrop" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <header class="modal-header">
            <h2>{{ title }}</h2>
            <button class="btn-close" (click)="close()">✕</button>
        </header>
        <div class="modal-body">
            <ng-content></ng-content>
        </div>
    </div>
</div>
}
