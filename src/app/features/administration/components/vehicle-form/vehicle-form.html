<form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()" class="form-container">
    <div class="form-group">
        <label>Tipo de Vehículo *</label>
        <select formControlName="tipoVehiculoId">
            <option value="">Seleccione...</option>
            @for (tipo of tiposVehiculo; track tipo.id) {
                <option [value]="tipo.id">{{ tipo.nombre }}</option>
            }
        </select>
    </div>

    <div class="form-group">
        <label>Placa *</label>
        <input type="text" formControlName="placa" placeholder="Ej: KHV53D" />
    </div>

    <div class="form-group">
        <label>Código Interno *</label>
        <input type="text" formControlName="codigo" placeholder="Ej: 003" />
    </div>

    <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onCancel.emit()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="vehicleForm.invalid">
            {{ vehicle ? 'Actualizar' : 'Guardar' }}
        </button>
    </div>
</form>
